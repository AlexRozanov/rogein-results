name: Android release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "versionName (semver), empty = from build.gradle.kts"
        required: false
        default: ""
      versionCode:
        description: "versionCode (int), empty = from build.gradle.kts"
        required: false
        default: ""
  push:
    tags:
      - "android-v*"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          NAME="${{ github.event.inputs.versionName }}"
          CODE="${{ github.event.inputs.versionCode }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == android-v* ]]; then
            NAME="${GITHUB_REF_NAME#android-v}"
          fi
          if [[ -z "${NAME}" ]]; then
            NAME="$(sed -n 's/.*versionName = .*?: \"\([^\"]*\)\".*/\1/p' android/app/build.gradle.kts | head -1)"
          fi
          if [[ -z "${CODE}" ]]; then
            CODE="$(sed -n 's/.*versionCode = .*?: \([0-9][0-9]*\).*/\1/p' android/app/build.gradle.kts | head -1)"
          fi
          echo "versionName=${NAME}" >> "$GITHUB_OUTPUT"
          echo "versionCode=${CODE}" >> "$GITHUB_OUTPUT"
          echo "Building ${NAME} (${CODE})"

      - name: Assemble release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${{ steps.ver.outputs.versionName }}" \
            -PversionCode="${{ steps.ver.outputs.versionCode }}"

      - name: Stage APK and version.json
        run: |
          set -euo pipefail
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk \
            dist-android/rogein-chip.apk
          cat > dist-android/version.json <<EOF
          {
            "versionName": "${{ steps.ver.outputs.versionName }}",
            "versionCode": ${{ steps.ver.outputs.versionCode }},
            "url": "/api/admin/app/download",
            "updatedAt": "$(date -u +%Y-%m-%d)"
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rogein-chip-${{ steps.ver.outputs.versionName }}
          path: |
            dist-android/rogein-chip.apk
            dist-android/version.json
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Rogein Chip ${{ steps.ver.outputs.versionName }}
          body: |
            Внутренняя сборка Android для команды судей.

            Установка: https://malahit-sprint.ru/admin/app (вход в кабинет → Приложение)
            или скачайте `rogein-chip.apk` из Assets и выложите через publish-android-apk.sh.
            Обновление ставится поверх (debug-подпись), данные на телефоне сохраняются.
          files: |
            dist-android/rogein-chip.apk
            dist-android/version.json
          fail_on_unmatched_files: true
