stages:
  - build

default:
  interruptible: true

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .npm/
    - .cargo/
    - tauri-vue-sqlite/src-tauri/target/

build:windows:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - cd tauri-vue-sqlite
    - npm ci
    - npm run tauri:build
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - tauri-vue-sqlite/src-tauri/target/release/bundle/msi/**/*
      - tauri-vue-sqlite/src-tauri/target/release/bundle/nsis/**/*

build:macos:
  stage: build
  tags:
    - macos
    - tauri
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - cd tauri-vue-sqlite
    - npm ci
    - npm run tauri:build
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - tauri-vue-sqlite/src-tauri/target/release/bundle/macos/**/*
      - tauri-vue-sqlite/src-tauri/target/release/bundle/dmg/**/*
